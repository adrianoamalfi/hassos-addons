name: Builder

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      addon:
        description: App directory, or all
        default: all
        type: string

permissions:
  contents: read

concurrency:
  group: builder-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}-${{ inputs.addon || 'all' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.apps.outputs.matrix }}
      addons: ${{ steps.apps.outputs.addons }}
      releases: ${{ steps.apps.outputs.releases }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Install tooling
        uses: ./.github/actions/setup-apps
      - name: Select apps
        id: apps
        run: python3 scripts/apps.py select --event-file "$GITHUB_EVENT_PATH" --github-output "$GITHUB_OUTPUT"
      - name: Test automation and runtime adapters
        run: |
          python3 -m unittest discover -s tests -v
          node --test tests/termix-runtime.test.cjs

  build:
    needs: discover
    if: needs.discover.outputs.addons != '[]'
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    name: Build and test ${{ matrix.addon }} (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install tooling
        uses: ./.github/actions/setup-apps
      - name: Build app
        env:
          ADDON: ${{ matrix.addon }}
          ARCH: ${{ matrix.arch }}
        run: python3 scripts/apps.py build --addon "$ADDON" --arch "$ARCH" --tag app-test:ci
      - name: Test the built image
        env:
          ADDON: ${{ matrix.addon }}
          ARCH: ${{ matrix.arch }}
        run: python3 scripts/apps.py test --addon "$ADDON" --arch "$ARCH" --tag app-test:ci
      - name: Test Termix ingress integration
        if: matrix.addon == 'termix' && matrix.arch == 'amd64'
        run: |
          docker tag app-test:ci local/termix:latest
          python3 tests/test-termix-ingress.py
      - name: Save tested image
        if: github.event_name == 'push' && contains(fromJSON(needs.discover.outputs.releases), matrix.addon)
        run: docker save app-test:ci -o /tmp/app-image.tar
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'push' && contains(fromJSON(needs.discover.outputs.releases), matrix.addon)
        with:
          name: image-${{ matrix.addon }}-${{ matrix.arch }}
          path: /tmp/app-image.tar
          retention-days: 2

  lint:
    needs: discover
    if: needs.discover.outputs.addons != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        addon: ${{ fromJSON(needs.discover.outputs.addons) }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: frenck/action-addon-linter@v2.21.1
        with:
          path: ./${{ matrix.addon }}

  publish:
    needs: [discover, build, lint]
    if: github.event_name == 'push' && needs.discover.outputs.releases != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install tooling
        uses: ./.github/actions/setup-apps
      - uses: actions/download-artifact@v4
        with:
          pattern: image-*
          path: /tmp/images
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested images
        env:
          RELEASE_APPS: ${{ needs.discover.outputs.releases }}
        run: python3 scripts/apps.py publish --artifacts /tmp/images --addons "$RELEASE_APPS"

  release:
    needs: [discover, publish]
    if: github.event_name == 'push' && needs.discover.outputs.releases != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        addon: ${{ fromJSON(needs.discover.outputs.releases) }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install tooling
        uses: ./.github/actions/setup-apps
      - name: Create app release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ADDON: ${{ matrix.addon }}
        run: python3 scripts/apps.py release --addon "$ADDON" --commit "$GITHUB_SHA"

  result:
    name: App build checks
    if: always()
    needs: [discover, build, lint, publish, release]
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          jobs = json.loads(os.environ['RESULTS'])
          assert jobs['discover']['result'] == 'success', jobs
          assert all(job['result'] in ('success', 'skipped') for job in jobs.values()), jobs
          PY
