name: Check App Updates

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: app-updates
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        addon: [duplicati, termix]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup-apps
      - name: Check and prepare update
        id: update
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ADDON: ${{ matrix.addon }}
        run: python3 scripts/upstream.py --addon "$ADDON" --prepare --github-output "$GITHUB_OUTPUT"
      - name: Create app update PR
        if: steps.update.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ADDON: ${{ matrix.addon }}
          VERSION: ${{ steps.update.outputs.version }}
        run: python3 scripts/update-pr.py --addon "$ADDON" --version "$VERSION"
